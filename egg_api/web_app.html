<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ทำนายสีไข่แดง (Egg Yolk Color Predictor)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Kanit', sans-serif; }
    body { background: #0f1117; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    
    .mobile-frame {
      width: 100%;
      max-width: 380px;
      height: 720px;
      background: #fff;
      border-radius: 40px;
      border: 8px solid #2d303e;
      box-shadow: 0 25px 60px rgba(0,0,0,0.6);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .home-bar {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 4px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 2px;
      z-index: 99;
    }

    .screen-area { flex: 1; display: flex; flex-direction: column; position: relative; overflow: hidden; }
    
    /* Screen Styles */
    .screen-splash { background: #FFC93C; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; }
    .screen-home { background: #fff; height: 100%; display: flex; flex-direction: column; padding: 16px; }
    .screen-crop { background: #111; height: 100%; display: flex; flex-direction: column; color: #fff; position: relative; user-select: none; }
    .screen-result { background: #FFC93C; height: 100%; display: flex; flex-direction: column; padding: 16px; color: #2b2100; overflow-y: auto; }
    .screen-detail { background: #fff; height: 100%; display: flex; flex-direction: column; padding: 16px; color: #1a1a1a; overflow-y: auto; }

    /* Buttons */
    .btn-dark { background: #1a1a1a; color: #fff; padding: 12px; border-radius: 24px; text-align: center; font-size: 14px; font-weight: 600; cursor: pointer; border: none; width: 100%; transition: all 0.2s; }
    .btn-dark:hover { background: #333; }
    .btn-outline { background: #fff; color: #1a1a1a; border: 1.5px solid #1a1a1a; padding: 11px; border-radius: 24px; text-align: center; font-size: 14px; font-weight: 600; cursor: pointer; width: 100%; transition: all 0.2s; }
    .btn-outline:hover { background: #f5f5f5; }
    
    #fileInput { display: none; }

    /* Square Cropper Container with 3x3 Grid */
    .crop-circle-mask {
      position: absolute;
      width: 160px;
      height: 160px;
      top: calc(50% - 80px);
      left: calc(50% - 80px);
      border-radius: 0;
      border: 2px solid #fff;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.65);
      cursor: grab;
      touch-action: none;
      background-image: 
        linear-gradient(to right, rgba(255,255,255,0.4) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255,255,255,0.4) 1px, transparent 1px);
      background-size: 33.33% 33.33%;
    }
    .crop-circle-mask:active {
      cursor: grabbing;
    }

    /* 4 Corner Handles with Big Touch Hitbox */
    .crop-handle {
      position: absolute;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 25;
    }
    .handle-dot {
      width: 14px;
      height: 14px;
      background: #fff;
      border: 2.5px solid #FFC93C;
      border-radius: 3px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.8);
      pointer-events: none;
    }
    .handle-tl { top: -14px; left: -14px; cursor: nwse-resize; }
    .handle-tr { top: -14px; right: -14px; cursor: nesw-resize; }
    .handle-bl { bottom: -14px; left: -14px; cursor: nesw-resize; }
    .handle-br { bottom: -14px; right: -14px; cursor: nwse-resize; }
  </style>
</head>
<body>

  <svg width="0" height="0" style="position:absolute">
    <defs>
      <radialGradient id="yolkGrad" cx="35%" cy="30%" r="75%">
        <stop offset="0%" stop-color="#FFD35C"/>
        <stop offset="55%" stop-color="#FBA919"/>
        <stop offset="100%" stop-color="#E1740A"/>
      </radialGradient>
    </defs>
  </svg>

  <div class="mobile-frame">
    <div class="screen-area" id="screen">
      <!-- Screens rendered dynamically -->
    </div>
    <div class="home-bar"></div>
  </div>

  <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">

  <script>
    let state = 'splash';
    let selectedImageSrc = '';
    let selectedFile = null;
    let croppedBlobFile = null;
    let resultData = {
      predicted_score: 15,
      raw_score: 14.85,
      rgb: { r: 206, g: 95, b: 23 },
      cielab: { l: 53, a: 40, b: 57, chroma: 69.6, hue_angle: 54.6 }
    };

    const yolkSvg = (s) => `<svg viewBox="0 0 120 120" width="${s}" height="${s}"><ellipse cx="60" cy="66" rx="54" ry="40" fill="#fff" stroke="#ecdfc0" stroke-width="2"/><circle cx="58" cy="58" r="27" fill="url(#yolkGrad)"/></svg>`;

    function renderScreen() {
      const screen = document.getElementById('screen');
      
      if (state === 'splash') {
        screen.innerHTML = `
          <div class="screen-splash">
            <div style="flex:1"></div>
            ${yolkSvg(85)}
            <div style="font-size:22px;font-weight:700;color:#2b2100;margin-top:8px">ทำนายสีไข่แดง</div>
            <div style="flex:1"></div>
            <div onclick="goTo('home')" class="btn-dark" style="margin-bottom:20px">เริ่ม</div>
          </div>
        `;
      } else if (state === 'home') {
        screen.innerHTML = `
          <div class="screen-home">
            <div style="font-weight:700;font-size:16px;color:#1a1a1a;margin-bottom:12px">วิธีใช้</div>
            <div style="display:flex;flex-direction:column;gap:12px;font-size:13px;color:#333;line-height:1.5">
              <div>1. เลือกวิธีนำเข้าภาพจากการถ่ายรูปหรือคลังรูปภาพ</div>
              <div>2. ปรับกรอบครอบเฉพาะไข่แดง</div>
              <div>3. เมื่อวิเคราะห์เสร็จจะปรากฏคะแนนสีของไข่แดง</div>
            </div>
            <div style="flex:1"></div>
            <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:10px">
              <div onclick="triggerUpload()" class="btn-dark">📷 ถ่ายรูป</div>
              <div onclick="triggerUpload()" class="btn-outline">🖼 คลังรูปภาพ</div>
            </div>
          </div>
        `;
      } else if (state === 'crop') {
        screen.innerHTML = `
          <div class="screen-crop">
            <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 16px;font-size:13px;z-index:10;background:rgba(0,0,0,0.6)">
              <span onclick="goTo('home')" style="cursor:pointer;font-size:16px;padding:4px 8px">✕</span>
              <span style="font-weight:600">ปรับกรอบครอบเฉพาะไข่แดง</span>
              <span onclick="confirmCrop()" style="cursor:pointer;font-weight:700;color:#FFC93C;font-size:18px;padding:4px 8px">✓</span>
            </div>
            <div style="flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#000" id="cropCanvas">
              ${selectedImageSrc ? `<img id="sourceImage" src="${selectedImageSrc}" style="max-width:100%;max-height:100%;object-fit:contain;pointer-events:none">` : yolkSvg(140)}
              
              <!-- Circular Cropper Box with 4 Handles -->
              <div class="crop-circle-mask" id="cropCircle">
                <div class="crop-handle handle-tl" data-handle="tl"><div class="handle-dot"></div></div>
                <div class="crop-handle handle-tr" data-handle="tr"><div class="handle-dot"></div></div>
                <div class="crop-handle handle-bl" data-handle="bl"><div class="handle-dot"></div></div>
                <div class="crop-handle handle-br" data-handle="br"><div class="handle-dot"></div></div>
              </div>
            </div>
            <div style="padding:12px;text-align:center;font-size:12px;color:#bbb;background:rgba(0,0,0,0.8);z-index:10">
              💡 ดึงปุ่มมุมทั้ง 4 ด้านเพื่อยืดเข้า-ออก | ลากตรงกลางเพื่อเลื่อนตำแหน่ง
            </div>
          </div>
        `;
        initInteractiveCircle();
      } else if (state === 'result') {
        screen.innerHTML = `
          <div class="screen-result">
            <div style="font-size:15px;font-weight:700;color:#2b2100;margin-bottom:10px">ค่าสีของไข่แดง</div>
            <div style="display:flex;flex-direction:column;align-items:center;gap:10px;flex:1">
              <div style="width:90px;height:90px;border-radius:50%;background:#ffffff33;overflow:hidden;display:flex;align-items:center;justify-content:center;border:3px solid #fff">
                ${selectedImageSrc ? `<img src="${selectedImageSrc}" style="width:100%;height:100%;object-fit:cover">` : yolkSvg(55)}
              </div>
              <div style="display:flex;gap:10px;width:100%">
                <div style="flex:1;background:#202124;color:#fff;border-radius:10px;padding:9px 10px;font-size:11px;line-height:1.6">
                  R : ${Math.round(resultData.rgb.r)}<br>G : ${Math.round(resultData.rgb.g)}<br>B : ${Math.round(resultData.rgb.b)}
                </div>
                <div style="flex:1;background:#202124;color:#fff;border-radius:10px;padding:9px 10px;font-size:11px;line-height:1.6">
                  L* : ${Math.round(resultData.cielab.l)}<br>a* : ${Math.round(resultData.cielab.a)}<br>b* : ${Math.round(resultData.cielab.b)}
                </div>
              </div>
              <div style="display:flex;gap:10px;width:100%">
                <div style="flex:1;background:#202124;color:#fff;border-radius:10px;padding:8px 10px;font-size:11px;display:flex;justify-content:space-between;align-items:center">
                  <span style="color:#aaa">Chroma (C*)</span>
                  <span style="font-weight:700">${(resultData.cielab.chroma || Math.sqrt(resultData.cielab.a**2 + resultData.cielab.b**2)).toFixed(1)}</span>
                </div>
                <div style="flex:1;background:#202124;color:#fff;border-radius:10px;padding:8px 10px;font-size:11px;display:flex;justify-content:space-between;align-items:center">
                  <span style="color:#aaa">Hue (h°)</span>
                  <span style="font-weight:700">${(resultData.cielab.hue_angle || 0).toFixed(1)}°</span>
                </div>
              </div>
              <div style="width:100%;font-size:12px;color:#3a2e00;font-weight:600;margin-top:4px">คะแนนสีของไข่แดง :</div>
              <div style="width:100%;background:#202124;color:#fff;border-radius:12px;padding:12px;text-align:center">
                <div style="font-size:36px;font-weight:700;line-height:1.1">${resultData.predicted_score}</div>
                <div style="font-size:11px;color:#888;margin-top:2px">Raw Score: ${resultData.raw_score.toFixed(2)}</div>
              </div>
              <div onclick="goTo('detail')" style="cursor:pointer;font-size:12px;color:#2b2100;text-decoration:underline;margin:4px 0">รายละเอียดเพิ่มเติม &gt;&gt;</div>
              <div style="flex:1"></div>
              <div onclick="goTo('home')" class="btn-dark">Back</div>
            </div>
          </div>
        `;
      } else if (state === 'detail') {
        screen.innerHTML = `
          <div class="screen-detail">
            <div style="display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700;color:#1a1a1a;margin-bottom:14px">
              <span onclick="goTo('result')" style="cursor:pointer;font-size:22px;padding:2px 6px">‹</span> Detail
            </div>
            <div style="display:flex;flex-direction:column;gap:16px;font-size:13px;line-height:1.5">
              <div>
                <div style="font-weight:700;color:#1a1a1a">ค่าสี RGB</div>
                <div style="color:#444">R : ${Math.round(resultData.rgb.r)} &nbsp; G : ${Math.round(resultData.rgb.g)} &nbsp; B : ${Math.round(resultData.rgb.b)}</div>
              </div>
              <div>
                <div style="font-weight:700;color:#1a1a1a">ค่าสี Lab</div>
                <div style="color:#444">L* : ${Math.round(resultData.cielab.l)} &nbsp; a* : ${Math.round(resultData.cielab.a)} &nbsp; b* : ${Math.round(resultData.cielab.b)}</div>
              </div>
              <div>
                <div style="font-weight:700;color:#1a1a1a">ค่า Chroma (ความสดของสี C*)</div>
                <div style="color:#444">${(resultData.cielab.chroma || Math.sqrt(resultData.cielab.a**2 + resultData.cielab.b**2)).toFixed(2)}</div>
              </div>
              <div>
                <div style="font-weight:700;color:#1a1a1a">ค่า Hue angle (มุมของโทนสี h°)</div>
                <div style="color:#444">${(resultData.cielab.hue_angle || (Math.atan2(resultData.cielab.b, resultData.cielab.a) * 180 / Math.PI + (Math.atan2(resultData.cielab.b, resultData.cielab.a) < 0 ? 360 : 0))).toFixed(2)}°</div>
              </div>
              <div>
                <div style="font-weight:700;color:#1a1a1a">ค่าคะแนนสีของไข่</div>
                <div style="color:#444;font-weight:700;font-size:18px">${resultData.predicted_score}</div>
              </div>
              <div>
                <div style="font-weight:700;color:#1a1a1a">รายละเอียด</div>
                <div style="color:#666">คะแนนระดับนี้บ่งบอกความเข้มของสีไข่แดง เทียบกับมาตรฐานพัดสี (Yolk Color Fan 1-15) โดยประมวลผลด้วยแบบจำลอง Machine Learning (SVR RBF Kernel)</div>
              </div>
            </div>
          </div>
        `;
      }
    }

    function initInteractiveCircle() {
      setTimeout(() => {
        const circle = document.getElementById('cropCircle');
        const canvas = document.getElementById('cropCanvas');
        if (!circle || !canvas) return;

        // Auto-fit default crop box to 78% of image size, perfectly centered
        const img = document.getElementById('sourceImage');
        if (img && img.naturalWidth) {
          const imgAspect = img.naturalWidth / img.naturalHeight;
          const canvasAspect = canvas.clientWidth / canvas.clientHeight;
          let dispW, dispH, dispL, dispT;
          if (imgAspect > canvasAspect) {
            dispW = canvas.clientWidth;
            dispH = canvas.clientWidth / imgAspect;
            dispL = 0;
            dispT = (canvas.clientHeight - dispH) / 2;
          } else {
            dispH = canvas.clientHeight;
            dispW = canvas.clientHeight * imgAspect;
            dispL = (canvas.clientWidth - dispW) / 2;
            dispT = 0;
          }
          const defaultSize = Math.min(dispW, dispH) * 0.90;
          circle.style.width = defaultSize + 'px';
          circle.style.height = defaultSize + 'px';
          circle.style.left = (dispL + (dispW - defaultSize) / 2) + 'px';
          circle.style.top = (dispT + (dispH - defaultSize) / 2) + 'px';
        }

        let mode = 'none'; // 'drag' | 'tl' | 'tr' | 'bl' | 'br'
        let startX = 0, startY = 0;
        let startL = 0, startT = 0, startW = 0;

        function getPos(e) {
          if (e.touches && e.touches.length > 0) {
            return { x: e.touches[0].clientX, y: e.touches[0].clientY };
          }
          return { x: e.clientX, y: e.clientY };
        }

        function onStart(e) {
          const p = getPos(e);
          const handle = e.target.closest('.crop-handle');

          startX = p.x;
          startY = p.y;
          startL = circle.offsetLeft;
          startT = circle.offsetTop;
          startW = circle.offsetWidth;

          if (handle) {
            mode = handle.getAttribute('data-handle');
          } else {
            mode = 'drag';
          }
          
          e.preventDefault();
        }

        function onMove(e) {
          if (mode === 'none') return;
          const p = getPos(e);
          const dx = p.x - startX;
          const dy = p.y - startY;

          if (mode === 'drag') {
            const maxL = canvas.clientWidth - circle.offsetWidth;
            const maxT = canvas.clientHeight - circle.offsetHeight;
            circle.style.left = Math.max(0, Math.min(maxL, startL + dx)) + 'px';
            circle.style.top = Math.max(0, Math.min(maxT, startT + dy)) + 'px';
          } else {
            // Directional Corner Resizing
            let delta = 0;
            if (mode === 'br') delta = (dx + dy) / 2;
            else if (mode === 'tl') delta = (-dx - dy) / 2;
            else if (mode === 'tr') delta = (dx - dy) / 2;
            else if (mode === 'bl') delta = (-dx + dy) / 2;

            const minSize = 40;
            const maxSize = Math.min(canvas.clientWidth, canvas.clientHeight) - 10;
            const newSize = Math.max(minSize, Math.min(maxSize, startW + delta * 2));
            const sizeDiff = newSize - startW;

            if (mode === 'tl') {
              circle.style.left = (startL - sizeDiff) + 'px';
              circle.style.top = (startT - sizeDiff) + 'px';
            } else if (mode === 'tr') {
              circle.style.top = (startT - sizeDiff) + 'px';
            } else if (mode === 'bl') {
              circle.style.left = (startL - sizeDiff) + 'px';
            }

            circle.style.width = newSize + 'px';
            circle.style.height = newSize + 'px';
          }
          e.preventDefault();
        }

        function onEnd() {
          mode = 'none';
        }

        circle.addEventListener('mousedown', onStart);
        window.addEventListener('mousemove', onMove);
        window.addEventListener('mouseup', onEnd);

        circle.addEventListener('touchstart', onStart, { passive: false });
        window.addEventListener('touchmove', onMove, { passive: false });
        window.addEventListener('touchend', onEnd);
      }, 50);
    }

    function goTo(id) {
      state = id;
      renderScreen();
    }

    function triggerUpload() {
      document.getElementById('fileInput').click();
    }

    function handleFileSelect(event) {
      const file = event.target.files[0];
      if (file) {
        selectedFile = file;
        const reader = new FileReader();
        reader.onload = function(e) {
          selectedImageSrc = e.target.result;
          goTo('crop');
        };
        reader.readAsDataURL(file);
      }
    }

    async function confirmCrop() {
      const imgElem = document.getElementById('sourceImage');
      const circle = document.getElementById('cropCircle');

      if (imgElem && circle) {
        const imgRect = imgElem.getBoundingClientRect();
        const circleRect = circle.getBoundingClientRect();

        const scaleX = imgElem.naturalWidth / imgRect.width;
        const scaleY = imgElem.naturalHeight / imgRect.height;

        const cropX = Math.max(0, (circleRect.left - imgRect.left) * scaleX);
        const cropY = Math.max(0, (circleRect.top - imgRect.top) * scaleY);
        const cropWidth = Math.min(imgElem.naturalWidth - cropX, circleRect.width * scaleX);
        const cropHeight = Math.min(imgElem.naturalHeight - cropY, circleRect.height * scaleY);

        const canvas = document.createElement('canvas');
        canvas.width = cropWidth;
        canvas.height = cropHeight;
        const ctx = canvas.getContext('2d');

        ctx.drawImage(imgElem, cropX, cropY, cropWidth, cropHeight, 0, 0, cropWidth, cropHeight);

        await new Promise((resolve) => {
          canvas.toBlob((blob) => {
            croppedBlobFile = new File([blob], 'cropped_yolk.jpg', { type: 'image/jpeg' });
            resolve();
          }, 'image/jpeg', 0.95);
        });
      }

      const uploadFile = croppedBlobFile || selectedFile;
      if (uploadFile) {
        const formData = new FormData();
        formData.append('file', uploadFile, 'cropped_yolk.jpg');

        try {
          const res = await fetch('/predict-image', {
            method: 'POST',
            body: formData
          });

          if (!res.ok) {
            const errData = await res.json();
            throw new Error(errData.detail || 'Failed to predict');
          }

          const data = await res.json();
          resultData = data;
          goTo('result');
        } catch (err) {
          alert('เกิดข้อผิดพลาดในการทำนาย: ' + err.message);
        }
      } else {
        goTo('result');
      }
    }

    // Start App
    renderScreen();
  </script>
</body>
</html>
